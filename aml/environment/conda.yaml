# Training environment (built once by Azure ML, then cached by content hash).
# MLflow 2.x: Azure ML's MLflow server does not support MLflow 3 "logged models" (404).
name: taxi-train
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - mlflow==2.22.5
      - azureml-mlflow==1.62.0.post6
      - scikit-learn==1.9.1
      - pandas==2.3.3
      - pyarrow==19.0.1 # mlflow 2.22 needs pyarrow<20
